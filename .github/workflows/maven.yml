# This workflow builds the Java project with Maven and caches dependencies.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "QAP1" ]
  pull_request:
    branches: [ "main", "QAP1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml